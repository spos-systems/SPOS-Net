<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <link rel="icon" href="assets/img/favicon-32.png">
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: linear-gradient(180deg, #050a13, #071120);
      color: #e9f3ff; font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;

    }
    .code { font-size: 5rem; font-weight: 900; margin: 0;

      background: linear-gradient(145deg, #30a8f0, #1890d8 60%, #0060a8);

    }
  </style>
