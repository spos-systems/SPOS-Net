<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/css/fonts.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Tajawal', 'Cairo', sans-serif;
    color: #eef2fa;
    background: #0a0e17;
    position: relative;
    display: flex;
    align-items: center;
  }
  .blob { position: absolute; border-radius: 50%; pointer-events: none; }
  .b1 { width: 900px; height: 900px; top: -430px; left: -260px;
        background: radial-gradient(closest-side, rgba(59,130,246,.30), transparent 70%); }
  .b2 { width: 780px; height: 780px; bottom: -420px; right: -240px;
        background: radial-gradient(closest-side, rgba(139,92,246,.26), transparent 70%); }
  .b3 { width: 700px; height: 700px; top: 40px; right: 240px;
        background: radial-gradient(closest-side, rgba(34,211,238,.10), transparent 70%); }

  .wrap { position: relative; z-index: 2; display: flex; width: 100%; padding: 0 64px; gap: 30px; align-items: center; }

  .right { flex: 1.25; }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  .mark { width: 58px; height: 58px; }
  .wordmark { font-family: 'Cairo'; font-weight: 800; font-size: 30px; letter-spacing: .01em;
              background: linear-gradient(120deg, #eef2fa 30%, #7dd3fc);
              -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  h1 { font-family: 'Cairo'; font-weight: 900; font-size: 56px; line-height: 1.32; margin-bottom: 14px; }
  h1 .grad { background: linear-gradient(120deg, #22d3ee, #818cf8 55%, #e879f9);
             -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .sub { font-size: 21px; color: #a5b1c8; line-height: 1.75; font-weight: 500; }
  .pills { display: flex; gap: 10px; margin-top: 26px; align-items: center; }
  .pill { padding: 9px 20px; border-radius: 999px; font-size: 16px; font-weight: 700; }
  .pill.url { background: linear-gradient(120deg, #22d3ee, #3b82f6); color: #fff; font-family: 'Cairo'; direction: ltr; }
  .pill.free { border: 1px solid rgba(148,163,194,.35); color: #c6cfdf; }

  .left { flex: 1; display: flex; align-items: center; justify-content: center; }
  .gauge { position: relative; width: 380px; height: 320px; }
  .gauge svg { position: absolute; inset: 0; }
  .gval { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 26px; }
  .gnum { font-family: 'Cairo'; font-weight: 800; font-size: 84px; line-height: 1; direction: ltr;
          text-shadow: 0 0 34px rgba(56,189,248,.35); }
  .gunit { font-family: 'Cairo'; font-weight: 700; font-size: 20px; color: #8b97b0; margin-top: 8px; direction: ltr; }

  .foot { position: absolute; bottom: 26px; inset-inline: 64px; display: flex; align-items: center; justify-content: space-between; z-index: 2; }
  .dev { display: flex; align-items: center; gap: 10px; font-size: 16px; color: #8b97b0; }
  .dev b { color: #c6cfdf; font-weight: 700; }
  .dev .logo { width: 26px; height: 26px; border-radius: 7px; }
  .en { font-family: 'Cairo'; direction: ltr; font-size: 15px; color: #66738e; font-weight: 600; }
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

  <div class="wrap">
    <div class="right">
      <div class="brand">
        <svg class="mark" viewBox="0 0 64 64">
          <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs>
          <rect x="3" y="3" width="58" height="58" rx="15" fill="#10151f" stroke="#28324a"/>
          <path d="M 18.57 45.43 A 19 19 0 1 1 45.43 45.43" fill="none" stroke="url(#g)" stroke-width="6" stroke-linecap="round"/>
          <line x1="32" y1="32" x2="36.4" y2="16.9" stroke="#e9edf5" stroke-width="4" stroke-linecap="round"/>
          <circle cx="32" cy="32" r="3" fill="#e9edf5"/>
        </svg>
        <span class="wordmark">SPOS Net</span>
      </div>
      <h1>اختبار سرعة الإنترنت <span class="grad">الأدق في ليبيا</span></h1>
      <div class="sub">تنزيل · رفع · استجابة · تذبذب · فقدان الحزم<br>معلومات مزودك وتقييم البث والألعاب — بمنهجية Speedtest</div>
      <div class="pills">
        <span class="pill url">net.spos.ly</span>
        <span class="pill free">مجاني وبدون تسجيل</span>
      </div>
    </div>

    <div class="left">
      <div class="gauge">
        <svg viewBox="0 0 380 320">
          <defs>
            <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/>
            </linearGradient>
          </defs>
          <path d="M 57.4 251.4 A 138 138 0 1 1 322.6 251.4" fill="none" stroke="rgba(148,163,194,.15)" stroke-width="17" stroke-linecap="round"/>
          <path d="M 57.4 251.4 A 138 138 0 1 1 322.6 251.4" fill="none" stroke="url(#arc)" stroke-width="17" stroke-linecap="round"
                stroke-dasharray="556" stroke-dashoffset="150" style="filter: drop-shadow(0 0 14px rgba(56,189,248,.55));"/>
          <circle cx="190" cy="160" r="9" fill="#3b82f6" style="filter: drop-shadow(0 0 10px rgba(59,130,246,.9));"/>
        </svg>
        <div class="gval">
          <span class="gnum">187</span>
          <span class="gunit">Mbps</span>
        </div>
      </div>
    </div>
  </div>

  <div class="foot">
    <div class="dev">طورته <img class="logo" src="company-logo.png" alt=""> <b>صولة للأنظمة SPOS</b></div>
    <div class="en">Internet Speed Test — Libya</div>
  </div>

  <script>
    document.fonts.ready.then(() => window.__fontsReady = true);
  </script>
</body>
</html>
