name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Validate site assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          for f in assets/js/*.js sw.js; do
            node --check "$f" || { echo "Syntax error in $f"; exit 1; }
          done
          echo "All JS files OK"

      - name: Validate JSON files
        run: |
          python3 -m json.tool manifest.webmanifest > /dev/null || { echo "Invalid manifest.webmanifest"; exit 1; }
          echo "JSON OK"

      - name: Verify local asset references exist
        run: |
          python3 - <<'EOF'
          import re, os, sys
          missing = []
          for root in ('.',):
              for dirpath, _, files in os.walk(root):
                  if '.git' in dirpath or 'node_modules' in dirpath:
                      continue
                  for fn in files:
                      if not fn.endswith(('.html', '.css')):
                          continue
                      path = os.path.join(dirpath, fn)
                      text = open(path, encoding='utf-8').read()
                      for m in re.finditer(r'''(?:src|href)=["'](?!https?:|mailto:|tel:|#|data:)([^"'#]+)''', text):
                          ref = m.group(1).split('?')[0]
                          if not ref:
                              continue
                          target = os.path.normpath(os.path.join(dirpath, ref))
                          if ref not in ('', './') and not os.path.exists(target):
                              missing.append(f"{path}: {ref}")
          if missing:
              print("Missing local assets:")
              print("\n".join(missing))
              sys.exit(1)
          print("All local asset references OK")
          EOF

      - name: Check repo files are present
        run: |
          for f in index.html LICENSE README.md manifest.webmanifest robots.txt sitemap.xml sw.js 404.html; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done
          echo "Core files OK"
